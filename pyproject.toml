[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bt_api_ctp"
version = "2.0.4+iteration41.i9"
description = "CTP exchange plugin for bt_api"
license = {text = "MIT"}
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
]
requires-python = ">=3.9"
dependencies = [
    "bt_api_base>=0.15.4,<1.0",
]

[project.optional-dependencies]
managed_execution = ["bt_api_execution>=0.2.0"]
# 迭代06 数据清洗：SFTP 拉取后端（Windows 分片机）需要 paramiko。
# rsync / local 后端不需要额外依赖。
cleaner = ["paramiko>=3.0"]

[project.entry-points."bt_api.plugins"]
ctp = "bt_api_ctp.plugin:register_plugin"

[project.entry-points."bt_api.query_providers"]
CTP___FUTURE = "bt_api_ctp.query_registration:register_ctp_query_provider"

[project.entry-points."bt_api.account_session_providers"]
CTP___FUTURE = "bt_api_ctp.store_account_session:register_ctp_account_session_provider"

[project.entry-points."bt_api.market_session_providers"]
CTP___FUTURE = "bt_api_ctp.market_session_registration:register_ctp_market_session_provider"

[project.entry-points."bt_api.market_tick_providers"]
CTP___FUTURE = "bt_api_ctp.market_tick_registration:register_ctp_market_tick_provider"

[project.entry-points."bt_api.provider_configurations"]
CTP___FUTURE = "bt_api_ctp.simnow_route_configuration:register_ctp_provider_configuration"

[project.entry-points."bt_api.typed_order_providers"]
CTP___FUTURE = "bt_api_ctp.order_provider:register_ctp_typed_order_provider"

[project.entry-points."bt_api.order_position_evidence_providers"]
CTP___FUTURE = "bt_api_ctp.order_position_evidence_provider:register_ctp_order_position_evidence_provider"

[project.entry-points."bt_api.risk_dispatch_evidence"]
ctp = "bt_api_ctp.risk_dispatch_binding:ctp_risk_dispatch_evidence_profile"

[project.entry-points."bt_api.execution_economics_providers"]
CTP___FUTURE = "bt_api_ctp.execution_economics_registration:register_ctp_execution_economics_provider"

[project.entry-points."bt_api.execution_rules_snapshot_providers"]
CTP___FUTURE = "bt_api_ctp.execution_rules_registration:register_ctp_execution_rules_snapshot_provider"

[project.entry-points."bt_api.execution_rules_providers"]
CTP___FUTURE = "bt_api_ctp.order_rules_provider:register_ctp_order_rules_provider"

[project.entry-points."bt_api.futures_eod_ranking_providers"]
CTP___FUTURE = "bt_api_ctp.futures_eod_ranking_registration:register_ctp_eod_ranking_provider"

[project.entry-points."bt_api.futures_expected_calendar_providers"]
CTP___FUTURE = "bt_api_ctp.futures_expected_calendar_provider:register_ctp_futures_expected_calendar_provider"

[project.entry-points."bt_api.order_identity_projections"]
CTP___FUTURE = "bt_api_ctp.order_identity_projection:project_order_identity"

[project.entry-points."bt_api.order_request_projections"]
CTP___FUTURE = "bt_api_ctp.order_request_mapping:map_order_request"

[project.entry-points."bt_api.order_quantity_unit_validators"]
CTP___FUTURE = "bt_api_ctp.order_quantity_units:validate_order_quantity_units"

[project.entry-points."bt_api.legacy_quote_v2_projectors"]
CTP___FUTURE = "bt_api_ctp.quote_v2_projection:build_quote_v2_projector"

[project.entry-points."bt_api.service_instrument_metadata_parsers"]
CTP___FUTURE = "bt_api_ctp.service_instrument_metadata:build_service_instrument_metadata_parser"

[project.entry-points."bt_api.service_observation_instrument_resolvers"]
CTP___FUTURE = "bt_api_ctp.service_observation_instrument:resolve_service_observation_instrument"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
include-package-data = false

[tool.cibuildwheel]
build = "cp39-* cp310-* cp311-* cp312-* cp313-* cp314-*"
skip = "*-musllinux_* *-manylinux_i686 *-win32 *-win_arm64 pp* cp3??t-*"
test-command = "python -c \"from bt_api_ctp.ctp._ctp_base import is_ctp_native_loaded, get_ctp_import_error; assert is_ctp_native_loaded(), get_ctp_import_error()\""

[tool.ruff]
src = ["src"]
fix = true
show-fixes = true
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["I", "UP", "E", "F", "W"]
ignore = [
    "E501",  # line too long
    "E731",  # lambda assignment
    "TC002",  # dynamic import
    "TRY003",  # broad Exception
    "F403",  # star import
    "F841",  # unused variable
    "Q000",  # bad quoting
    "Q003",  # bad escaping
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S106", "S105", "S311", "E402", "PERF401", "N806", "S108"]
"examples/**" = ["S106", "S105", "S311", "E402", "PERF401", "N806", "S108"]
"scripts/**" = ["S106", "S105", "S311", "E402", "PERF401", "N806", "S108"]
"src/bt_api_ctp/ctp/__init__.py" = ["F401"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
markers = [
    "ctp: CTP related tests",
    "ticker: Tests covering ticker data and event handling",
    "network: Tests requiring network access",
    "unit: Unit tests (fast, no external dependencies)",
    "integration: Integration tests (may require external services)",
]

[project.entry-points."bt_api.fee_projections"]
CTP___FUTURE = "bt_api_base.fee_projection:legacy_fee_projection"

[project.entry-points."bt_api.instrument_rules_projections"]
CTP___FUTURE = "bt_api_ctp.instrument_rules_projection:project_instrument_rules"

[project.entry-points."bt_api.order_side_projections"]
CTP___FUTURE = "bt_api_ctp.order_side_projection:order_side_candidates"

[project.entry-points."bt_api.normalization_policies"]
CTP___FUTURE = "bt_api_ctp.normalization_policy:normalization_policy"

[project.entry-points."bt_api.execution_configuration_policies"]
CTP___FUTURE = "bt_api_base.execution_configuration_policy:legacy_execution_configuration_policy"

[project.entry-points."bt_api.execution_ledger_identity_policies"]
CTP = "bt_api_base.execution_ledger_identity_policy:legacy_ledger_policy"

[project.entry-points."bt_api.account_risk_source_policies"]
CTP = "bt_api_ctp.account_risk_source_policy:account_risk_source_policy"
