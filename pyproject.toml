[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bt_api_ctp"
version = "2.0.0"
description = "CTP exchange plugin for bt_api"
license = "MIT"
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
]
requires-python = ">=3.9"
dependencies = [
    "bt_api_base>=0.15,<1.0",
]

[project.entry-points."bt_api.plugins"]
ctp = "bt_api_ctp.plugin:register_plugin"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
include-package-data = false

[tool.cibuildwheel]
build = "cp39-* cp310-* cp311-* cp312-* cp313-* cp314-*"
skip = "*-musllinux_* *-manylinux_i686 *-win32 *-win_arm64 pp* cp3??t-*"
test-command = "python -c \"from bt_api_ctp.ctp._ctp_base import is_ctp_native_loaded, get_ctp_import_error; assert is_ctp_native_loaded(), get_ctp_import_error()\""

[tool.ruff]
src = ["src"]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["I", "UP", "E", "F", "W"]
ignore = ["E501", "E731", "F403", "F841", "Q000", "Q003"]

[tool.ruff.lint.per-file-ignores]
"src/bt_api_ctp/ctp/__init__.py" = ["F401"]

[tool.ruff.format]
quote-style = "single"

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
markers = [
    "ctp: CTP related tests",
    "network: Tests requiring network access",
    "ticker: Tests for ticker behavior",
    "unit: Unit tests without external dependencies",
    "integration: Tests requiring external services",
]
