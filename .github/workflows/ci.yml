name: CI

on:
  push:
    branches: [main, master]
    tags: [v*]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality Gates
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip ruff
      - name: Ruff lint
        run: python -m ruff check src/ tests/ setup.py --output-format=github
      - name: Ruff format
        run: python -m ruff format --check src/ tests/ setup.py

  test:
    name: Test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
      - name: Run tests
        run: python -m pytest tests/ -v --tb=short

  native-wheel:
    name: Native wheel (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    needs: [quality, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-x86_64
            os: ubuntu-latest
            archs: x86_64
          - name: macos-x86_64
            os: macos-15-intel
            archs: x86_64
          - name: macos-arm64
            os: macos-14
            archs: arm64
          - name: windows-amd64
            os: windows-latest
            archs: AMD64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build and import-test native wheel
        run: |
          python -m pip install --upgrade pip "cibuildwheel>=3,<4"
          python -m cibuildwheel --output-dir wheelhouse
        env:
          CIBW_BUILD: cp311-*
          CIBW_ARCHS: ${{ matrix.archs }}
          CIBW_ENVIRONMENT_MACOS: MACOSX_DEPLOYMENT_TARGET=11.0
      - uses: actions/upload-artifact@v4
        with:
          name: native-wheel-${{ matrix.name }}
          path: wheelhouse/*.whl

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Build
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          python -m build --sdist
